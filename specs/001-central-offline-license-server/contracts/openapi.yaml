openapi: 3.1.0
info:
  title: Offline License Server API
  version: 1.0.0
  description: >-
    Versioned administrative and authenticated product-runtime contracts. Every operation returns
    a stable decision envelope; HTTP status communicates transport outcome, not license meaning.
servers:
  - url: https://license-server.internal/api/v1/license
tags:
  - name: Administration
  - name: Runtime
  - name: Audit
paths:
  /status:
    get:
      tags: [Administration]
      operationId: getLicenseStatus
      security: [{ adminBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/Decision' }
  /entitlements:
    get:
      tags: [Administration]
      operationId: getEntitlements
      security: [{ adminBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/Decision' }
  /utilization:
    get:
      tags: [Administration]
      operationId: getUtilization
      security: [{ adminBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/Decision' }
  /activation/request:
    post:
      tags: [Administration]
      operationId: generateActivationRequest
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivationRequestCommand' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
  /activation/import:
    post:
      tags: [Administration]
      operationId: importActivation
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivationImportCommand' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
        '422': { $ref: '#/components/responses/Decision' }
  /instances/register:
    post:
      tags: [Administration]
      operationId: registerInstance
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstanceRegistrationCommand' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
        '409': { $ref: '#/components/responses/Decision' }
  /instances:
    get:
      tags: [Administration]
      operationId: listInstances
      security: [{ adminBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/Decision' }
  /instances/{id}:
    delete:
      tags: [Administration]
      operationId: decommissionInstance
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/InstancePathId'
        - name: force
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonCommand' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
        '409': { $ref: '#/components/responses/Decision' }
  /instances/{id}/activate:
    post:
      tags: [Administration]
      operationId: activateInstance
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/InstancePathId' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvironmentTransitionCommand' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
        '409': { $ref: '#/components/responses/Decision' }
  /instances/{id}/standby:
    post:
      tags: [Administration]
      operationId: standbyInstance
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/InstancePathId' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvironmentTransitionCommand' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
        '409': { $ref: '#/components/responses/Decision' }
  /instances/failover:
    post:
      tags: [Administration]
      operationId: failoverToDisasterRecovery
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstanceHandoffCommand' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
        '409': { $ref: '#/components/responses/Decision' }
  /instances/failback:
    post:
      tags: [Administration]
      operationId: failbackToPrimary
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstanceHandoffCommand' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
        '409': { $ref: '#/components/responses/Decision' }
  /users/named:
    post:
      tags: [Administration]
      operationId: assignNamedUser
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedUserCommand' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
        '409': { $ref: '#/components/responses/Decision' }
  /users/named/{userId}:
    delete:
      tags: [Administration]
      operationId: releaseNamedUser
      security: [{ adminBearer: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedUserReleaseCommand' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
  /leases/users:
    post:
      tags: [Runtime]
      operationId: acquireUserLease
      security: [{ instanceSignature: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestTimestamp' }, { $ref: '#/components/parameters/RequestNonce' }, { $ref: '#/components/parameters/BodyDigest' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserLeaseAcquireCommand' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
        '409': { $ref: '#/components/responses/Decision' }
  /leases/users/{leaseId}/heartbeat:
    post:
      tags: [Runtime]
      operationId: heartbeatUserLease
      security: [{ instanceSignature: [] }]
      parameters:
        - $ref: '#/components/parameters/LeasePathId'
        - $ref: '#/components/parameters/RequestTimestamp'
        - $ref: '#/components/parameters/RequestNonce'
        - $ref: '#/components/parameters/BodyDigest'
      responses:
        '200': { $ref: '#/components/responses/Decision' }
  /leases/users/{leaseId}:
    delete:
      tags: [Runtime]
      operationId: releaseUserLease
      security: [{ instanceSignature: [] }]
      parameters:
        - $ref: '#/components/parameters/LeasePathId'
        - $ref: '#/components/parameters/RequestTimestamp'
        - $ref: '#/components/parameters/RequestNonce'
        - $ref: '#/components/parameters/BodyDigest'
      responses:
        '200': { $ref: '#/components/responses/Decision' }
  /agents:
    post:
      tags: [Administration]
      operationId: registerAgent
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRegistrationCommand' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
        '409': { $ref: '#/components/responses/Decision' }
  /agents/{agentId}:
    delete:
      tags: [Administration]
      operationId: decommissionAgent
      security: [{ adminBearer: [] }]
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
  /leases/agents:
    post:
      tags: [Runtime]
      operationId: acquireAgentLease
      security: [{ instanceSignature: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestTimestamp' }, { $ref: '#/components/parameters/RequestNonce' }, { $ref: '#/components/parameters/BodyDigest' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentLeaseAcquireCommand' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
        '409': { $ref: '#/components/responses/Decision' }
  /leases/agents/{leaseId}/heartbeat:
    post:
      tags: [Runtime]
      operationId: heartbeatAgentLease
      security: [{ instanceSignature: [] }]
      parameters:
        - $ref: '#/components/parameters/LeasePathId'
        - $ref: '#/components/parameters/RequestTimestamp'
        - $ref: '#/components/parameters/RequestNonce'
        - $ref: '#/components/parameters/BodyDigest'
      responses:
        '200': { $ref: '#/components/responses/Decision' }
  /leases/agents/{leaseId}:
    delete:
      tags: [Runtime]
      operationId: releaseAgentLease
      security: [{ instanceSignature: [] }]
      parameters:
        - $ref: '#/components/parameters/LeasePathId'
        - $ref: '#/components/parameters/RequestTimestamp'
        - $ref: '#/components/parameters/RequestNonce'
        - $ref: '#/components/parameters/BodyDigest'
      responses:
        '200': { $ref: '#/components/responses/Decision' }
  /usage:
    post:
      tags: [Runtime]
      operationId: consumeUsage
      security: [{ instanceSignature: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestTimestamp' }, { $ref: '#/components/parameters/RequestNonce' }, { $ref: '#/components/parameters/BodyDigest' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsageCommand' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
        '409': { $ref: '#/components/responses/Decision' }
  /cached-entitlements:
    post:
      tags: [Runtime]
      operationId: issueCachedEntitlement
      security: [{ instanceSignature: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestTimestamp' }, { $ref: '#/components/parameters/RequestNonce' }, { $ref: '#/components/parameters/BodyDigest' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CachedEntitlementCommand' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
  /runtime/products/{productId}:
    get:
      tags: [Runtime]
      operationId: checkProduct
      security: [{ instanceSignature: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductPathId'
        - $ref: '#/components/parameters/RequestTimestamp'
        - $ref: '#/components/parameters/RequestNonce'
        - $ref: '#/components/parameters/BodyDigest'
      responses:
        '200': { $ref: '#/components/responses/Decision' }
  /runtime/products/{productId}/features/{featureId}:
    get:
      tags: [Runtime]
      operationId: checkFeature
      security: [{ instanceSignature: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductPathId'
        - name: featureId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$' }
        - $ref: '#/components/parameters/RequestTimestamp'
        - $ref: '#/components/parameters/RequestNonce'
        - $ref: '#/components/parameters/BodyDigest'
      responses:
        '200': { $ref: '#/components/responses/Decision' }
  /runtime/products/{productId}/users/{userId}/capacity:
    get:
      tags: [Runtime]
      operationId: checkProductUserCapacity
      security: [{ instanceSignature: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductPathId'
        - name: userId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: '#/components/parameters/RequestTimestamp'
        - $ref: '#/components/parameters/RequestNonce'
        - $ref: '#/components/parameters/BodyDigest'
      responses:
        '200': { $ref: '#/components/responses/Decision' }
  /audit:
    get:
      tags: [Audit]
      operationId: getAudit
      security: [{ adminBearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      description: POC administrator token supplied externally; future external auth replaces it.
    instanceSignature:
      type: apiKey
      in: header
      name: X-License-Signature
      description: >-
        Base64URL Ed25519 signature over method, canonical path/query, instance ID, timestamp,
        nonce, and SHA-256 body digest. Companion headers below are mandatory.
  parameters:
    InstancePathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LeasePathId:
      name: leaseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductPathId:
      name: productId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$' }
    RequestTimestamp:
      name: X-License-Timestamp
      in: header
      required: true
      schema: { type: string, format: date-time }
    RequestNonce:
      name: X-License-Nonce
      in: header
      required: true
      schema: { type: string, minLength: 22, maxLength: 128 }
    BodyDigest:
      name: X-License-Content-SHA256
      in: header
      required: true
      schema: { type: string, minLength: 43, maxLength: 43 }
  responses:
    Decision:
      description: Stable license decision envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DecisionEnvelope' }
  schemas:
    DecisionEnvelope:
      type: object
      additionalProperties: false
      required: [decisionId, allowed, reasonCode, decidedAt, operation, correlationId]
      properties:
        decisionId: { type: string, format: uuid }
        allowed: { type: boolean }
        reasonCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,95}$' }
        decidedAt: { type: string, format: date-time }
        operation: { type: string }
        correlationId: { type: string }
        warnings: { type: array, items: { type: string } }
        data: { type: object, additionalProperties: true }
    ActivationRequestCommand:
      type: object
      required: [licenseId, customerId]
      properties:
        licenseId: { type: string }
        customerId: { type: string }
        environmentEvidence: { type: object, additionalProperties: { type: string } }
    ActivationImportCommand:
      type: object
      additionalProperties: false
      required: [commercialLicenseEnvelope, activationCertificateEnvelope]
      properties:
        commercialLicenseEnvelope: { $ref: '#/components/schemas/SignedEnvelope' }
        activationCertificateEnvelope: { $ref: '#/components/schemas/SignedEnvelope' }
    CommercialLicense:
      $ref: './commercial-license.schema.json'
    SignedEnvelope:
      type: object
      additionalProperties: false
      required: [envelopeVersion, artifactType, payloadSchemaVersion, algorithm, keyId, payload, signature]
      properties:
        envelopeVersion: { const: '1' }
        artifactType: { enum: [COMMERCIAL_LICENSE, ACTIVATION_CERTIFICATE, CACHED_ENTITLEMENT] }
        payloadSchemaVersion: { const: '1.0' }
        algorithm: { const: Ed25519 }
        keyId: { type: string, minLength: 64, maxLength: 64 }
        payload:
          type: string
          contentEncoding: base64
          description: RFC 4648 base64url without padding; COMMERCIAL_LICENSE decodes to the CommercialLicense schema.
        signature: { type: string, contentEncoding: base64 }
    InstanceRegistrationCommand:
      type: object
      additionalProperties: false
      required: [instanceId, publicKey, productId, deploymentType, environmentType, applicationVersion]
      properties:
        instanceId: { type: string, format: uuid }
        publicKey: { type: string, contentEncoding: base64 }
        productId: { type: string }
        deploymentType: { type: string, enum: [TOMCAT, KUBERNETES, OTHER] }
        environmentType: { type: string, enum: [PRODUCTION, DISASTER_RECOVERY, UAT, QA, DEVELOPMENT, OTHER] }
        applicationVersion: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
    ReasonCommand:
      type: object
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    EnvironmentTransitionCommand:
      allOf:
        - $ref: '#/components/schemas/ReasonCommand'
        - type: object
          properties:
            counterpartInstanceId: { type: string, format: uuid }
    InstanceHandoffCommand:
      type: object
      additionalProperties: false
      required: [currentActiveInstanceId, targetStandbyInstanceId, force]
      properties:
        currentActiveInstanceId: { type: string, minLength: 1 }
        targetStandbyInstanceId: { type: string, minLength: 1 }
        force: { type: boolean }
    NamedUserCommand:
      type: object
      required: [userId]
      properties:
        userId: { type: string }
        productId: { type: string }
        categoryId: { type: string }
        overrideType: { type: string, enum: [NONE, EMPLOYEE_DEPARTURE, CORRECTION] }
        overrideReason: { type: string }
    NamedUserReleaseCommand:
      type: object
      additionalProperties: false
      description: Override fields are all required together when overrideType is not NONE.
      properties:
        productId: { type: string }
        category: { type: string, enum: [REPORTING, DQ_ISSUE_MANAGER] }
        overrideType: { type: string, enum: [NONE, EMPLOYEE_DEPARTURE, ASSIGNMENT_CORRECTION] }
        actor: { type: string, minLength: 1, maxLength: 200 }
        justification: { type: string, minLength: 1, maxLength: 1000 }
        previousUser: { type: string, minLength: 1, maxLength: 200 }
        replacementUser: { type: string, minLength: 1, maxLength: 200 }
    UserLeaseAcquireCommand:
      type: object
      additionalProperties: false
      required: [instanceId, userId, sessionId, idempotencyKey]
      properties:
        instanceId: { type: string, format: uuid }
        userId: { type: string }
        sessionId: { type: string }
        productId: { type: string }
        idempotencyKey: { type: string, format: uuid }
    AgentRegistrationCommand:
      type: object
      required: [agentId, displayName, productInstanceId]
      properties:
        agentId: { type: string }
        displayName: { type: string }
        productInstanceId: { type: string, format: uuid }
    AgentLeaseAcquireCommand:
      type: object
      required: [instanceId, agentId, executionId, idempotencyKey]
      properties:
        instanceId: { type: string, format: uuid }
        agentId: { type: string }
        executionId: { type: string }
        idempotencyKey: { type: string, format: uuid }
    UsageCommand:
      type: object
      additionalProperties: false
      required: [instanceId, meterId, actionType, idempotencyKey]
      properties:
        instanceId: { type: string, format: uuid }
        meterId: { type: string }
        actionType: { type: string, enum: [INTERACTIVE_AI_REQUEST, AUTONOMOUS_AGENT_RUN, AGENT_TOOL_INVOCATION, SCHEDULED_AGENT_RUN] }
        idempotencyKey: { type: string, format: uuid }
        dimensions: { type: object, additionalProperties: { type: string } }
    CachedEntitlementCommand:
      type: object
      additionalProperties: false
      required: [instanceId]
      properties:
        instanceId: { type: string, format: uuid }
        requestedValiditySeconds: { type: integer, minimum: 60, maximum: 86400 }
